name: GMB Image Generator Agent (6 Opérateurs Parallèles)

on:
  schedule:
    # Exécution automatique chaque soir à 20h00 UTC (22h00 heure de Paris)
    - cron: '0 20 * * *'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

jobs:
  generate-images:
    name: Agent Image - ${{ matrix.operator }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        operator: [Kevin, Fif, Aina, Anjara, Korail, Kintana]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: ./agent
        run: npm install
        
      - name: Run Image Generator Agent for ${{ matrix.operator }}
        working-directory: ./agent
        env:
          OPERATOR_NAME: ${{ matrix.operator }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_COOKIES }}
          CHATGPT_CONVERSATION_URL: ${{ secrets.CHATGPT_CONVERSATION_URL }}
          CHATGPT_CONVERSATION_URL_KEVIN: ${{ secrets.CHATGPT_CONVERSATION_URL_KEVIN }}
          CHATGPT_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_CONVERSATION_URL_FIF }}
          CHATGPT_CONVERSATION_URL_AINA: ${{ secrets.CHATGPT_CONVERSATION_URL_AINA }}
          CHATGPT_CONVERSATION_URL_ANJARA: ${{ secrets.CHATGPT_CONVERSATION_URL_ANJARA }}
          CHATGPT_CONVERSATION_URL_KORAIL: ${{ secrets.CHATGPT_CONVERSATION_URL_KORAIL }}
          CHATGPT_CONVERSATION_URL_KINTANA: ${{ secrets.CHATGPT_CONVERSATION_URL_KINTANA }}
          CHATGPT_IMAGE_PROMPT: ${{ secrets.CHATGPT_IMAGE_PROMPT }}
        run: node index.js
