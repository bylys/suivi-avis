name: GMB Image Generator - Fifa

on:
  schedule:
    # Exécution automatique du lundi au vendredi à 06h00 du matin heure de Thaïlande (UTC+7 -> 23h00 UTC du dimanche au jeudi)
    # 0 = Dimanche UTC (Lundi 06:00 THA), 4 = Jeudi UTC (Vendredi 06:00 THA)
    - cron: '0 23 * * 0-4'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

concurrency:
  group: browserless-chatgpt-runner
  cancel-in-progress: false

jobs:
  generate-images-fifa:
    name: Agent Image - Fifa
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies & Chromium
        working-directory: ./agent
        run: |
          npm install
          npx playwright install --with-deps chromium
        
      - name: Run Image Generator Agent for Fifa
        working-directory: ./agent
        env:
          OPERATOR_NAME: Fifaliana
          TARGET_DATE: '2026-09-09'
          FORCE_EXECUTION: 'true'
          FORCE_PLAN_PERSO: 'true'
          FORCE_PLAN_PRO: 'false'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          
          # Cookies Plan PRO / WORK
          CHATGPT_PRO_COOKIES_FIF: ${{ secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_WORK_COOKIES_FIFA || secrets.CHATGPT_PRO_COOKIES_FIFA }}
          CHATGPT_WORK_COOKIES_FIF: ${{ secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_WORK_COOKIES_FIFA || secrets.CHATGPT_PRO_COOKIES_FIFA }}
          CHATGPT_PRO_COOKIES_FIFALIANA: ${{ secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_WORK_COOKIES_FIFA || secrets.CHATGPT_PRO_COOKIES_FIFA }}
          CHATGPT_WORK_COOKIES_FIFALIANA: ${{ secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_WORK_COOKIES_FIFA || secrets.CHATGPT_PRO_COOKIES_FIFA }}
          
          # Cookies Plan PERSO / SECOURS
          CHATGPT_PERSO_COOKIES_FIF: ${{ secrets.CHATGPT_PERSO_COOKIES_FIF || secrets.CHATGPT_PERSO_COOKIES_FIFA || secrets.CHATGPT_COOKIES_FIF || secrets.CHATGPT_COOKIES }}
          CHATGPT_PERSO_COOKIES_FIFALIANA: ${{ secrets.CHATGPT_PERSO_COOKIES_FIF || secrets.CHATGPT_PERSO_COOKIES_FIFA || secrets.CHATGPT_COOKIES_FIF || secrets.CHATGPT_COOKIES }}
          CHATGPT_COOKIES_FIF: ${{ secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PERSO_COOKIES_FIF || secrets.CHATGPT_COOKIES_FIF || secrets.CHATGPT_COOKIES }}
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PERSO_COOKIES_FIF || secrets.CHATGPT_COOKIES }}
          
          # URLs de conversation Plan PRO / WORK
          CHATGPT_PRO_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_WORK_CONVERSATION_URL_FIFA || secrets.CHATGPT_PRO_CONVERSATION_URL_FIFA }}
          CHATGPT_WORK_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_WORK_CONVERSATION_URL_FIFA || secrets.CHATGPT_PRO_CONVERSATION_URL_FIFA }}
          CHATGPT_PRO_CONVERSATION_URL_FIFALIANA: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_WORK_CONVERSATION_URL_FIFA || secrets.CHATGPT_PRO_CONVERSATION_URL_FIFA }}
          CHATGPT_WORK_CONVERSATION_URL_FIFALIANA: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_WORK_CONVERSATION_URL_FIFA || secrets.CHATGPT_PRO_CONVERSATION_URL_FIFA }}
          
          # URLs de conversation Plan PERSO / SECOURS
          CHATGPT_PERSO_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF || secrets.CHATGPT_PERSO_CONVERSATION_URL_FIFA }}
          CHATGPT_PERSO_CONVERSATION_URL_FIFALIANA: ${{ secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF || secrets.CHATGPT_PERSO_CONVERSATION_URL_FIFA }}
          CHATGPT_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF || secrets.CHATGPT_CONVERSATION_URL }}
          CHATGPT_CONVERSATION_URL: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF || secrets.CHATGPT_CONVERSATION_URL }}
          
          CHATGPT_IMAGE_PROMPT: ${{ secrets.CHATGPT_IMAGE_PROMPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-fifa
          path: agent/debug-error-*.png
          retention-days: 3
