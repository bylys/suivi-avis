name: Fix Google Drive Photos Date (26-08 -> 27-08-2026)

on:
  push:
    paths:
      - 'agent/fix_drive_photos.js'
      - '.github/workflows/fix-drive-photos.yml'
  workflow_dispatch:

jobs:
  fix-drive-photos:
    name: Fix & Move Google Drive Photos
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        working-directory: ./agent
        run: npm install
        
      - name: Run Drive Photos Fixer
        working-directory: ./agent
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
        run: node fix_drive_photos.js

      - name: Get Fifa & Kevin Photo Links
        working-directory: ./agent
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
        run: node get_fifa_kevin_links.js
