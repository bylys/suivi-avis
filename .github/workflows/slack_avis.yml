name: Slack — Alertes avis GMB

on:
  schedule:
    # Rapport quotidien lun-ven à 11h00 heure TH (UTC+7) = 4h00 UTC
    - cron: "0 4 * * 1-5"
    # Rapport survie J+30 — 1er du mois à 9h30 TH = 2h30 UTC
    - cron: "30 2 1 * *"
    # Rapport survie J+30 — 15 du mois à 9h30 TH = 2h30 UTC
    - cron: "30 2 15 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode à lancer manuellement"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - survival

jobs:
  daily:
    name: Rapport quotidien avis
    if: (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Envoyer rapport quotidien
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/slack_notify.py daily

  survival:
    name: Rapport survie J+30
    if: (github.event_name == 'schedule' && (github.event.schedule == '30 2 1 * *' || github.event.schedule == '30 2 15 * *')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'survival')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Envoyer rapport survie J+30
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/slack_notify.py survival
