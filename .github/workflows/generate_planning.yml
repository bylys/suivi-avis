name: Génération planning quotidien GMB

on:
  schedule:
    # Chaque matin à 6h00 heure de Paris (UTC+2 été = 4h UTC)
    # Tous les jours (le script gère : rien le dimanche sauf dates de rattrapage Aina)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      quota:
        description: "Quota des nouveaux VA (Korail/Anjara/Kintana/Aina) — Kevin/Fif restent à 50"
        required: false
        default: "40"

jobs:
  planning:
    name: Générer le planning du jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le planning
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DECODO_USER: ${{ secrets.DECODO_USER }}
          DECODO_PASS: ${{ secrets.DECODO_PASS }}
          DECODO_USER_MOBILE: ${{ secrets.DECODO_USER_MOBILE }}
          DECODO_PASS_MOBILE: ${{ secrets.DECODO_PASS_MOBILE }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          QUOTA_PAR_OPERATEUR: ${{ github.event.inputs.quota || '40' }}
        run: python scripts/generate_planning.py
