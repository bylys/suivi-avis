name: GMB Image Generator Agent

on:
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub

jobs:
  generate-images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'agent/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./agent
        run: npm install
        
      - name: Run Image Generator Agent
        working-directory: ./agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_COOKIES }}
        run: node index.js
