name: GMB Image Generator - Fifa

on:
  schedule:
    # Exécution automatique du lundi au vendredi à 01h00 du matin heure de Thaïlande (UTC+7 -> 18h00 UTC du dimanche au jeudi)
    # 0 = Dimanche UTC (Lundi 01:00 THA), 4 = Jeudi UTC (Vendredi 01:00 THA)
    - cron: '0 18 * * 0-4'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

jobs:
  generate-images-fifa:
    name: Agent Image - Fifa
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies & Chromium
        working-directory: ./agent
        run: |
          npm install
          npx playwright install --with-deps chromium
        
      - name: Run Image Generator Agent for Fifa
        working-directory: ./agent
        env:
          OPERATOR_NAME: Fif
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          
          # Cookies Plan PRO / WORK (toutes les variantes de nommage possibles dans GitHub Secrets)
          CHATGPT_PRO_COOKIES_FIF: ${{ secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_PRO_COOKIES_FIFA || secrets.CHATGPT_COOKIES_PRO_FIF || secrets.CHATGPT_COOKIES_PRO_FIFA || secrets.CHATGPT_COOKIES_FIF_PRO || secrets.CHATGPT_COOKIES_FIFA_PRO || secrets.COOKIES_PRO_FIF || secrets.COOKIES_PRO_FIFA }}
          CHATGPT_WORK_COOKIES_FIF: ${{ secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_WORK_COOKIES_FIFA || secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_PRO_COOKIES_FIFA || secrets.CHATGPT_COOKIES_PRO_FIF || secrets.CHATGPT_COOKIES_PRO_FIFA }}
          CHATGPT_PRO_COOKIES_FIFA: ${{ secrets.CHATGPT_PRO_COOKIES_FIFA || secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_COOKIES_PRO_FIFA || secrets.CHATGPT_COOKIES_PRO_FIF }}
          CHATGPT_WORK_COOKIES_FIFA: ${{ secrets.CHATGPT_WORK_COOKIES_FIFA || secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PRO_COOKIES_FIFA || secrets.CHATGPT_PRO_COOKIES_FIF }}
          
          # Cookies Plan PERSO / SECOURS (toutes les variantes de nommage possibles dans GitHub Secrets)
          CHATGPT_PERSO_COOKIES_FIF: ${{ secrets.CHATGPT_PERSO_COOKIES_FIF || secrets.CHATGPT_PERSO_COOKIES_FIFA || secrets.CHATGPT_COOKIES_PERSO_FIF || secrets.CHATGPT_COOKIES_PERSO_FIFA || secrets.CHATGPT_COOKIES_FIF_PERSO || secrets.CHATGPT_COOKIES_FIFA_PERSO || secrets.COOKIES_PERSO_FIF || secrets.COOKIES_PERSO_FIFA }}
          CHATGPT_PERSO_COOKIES_FIFA: ${{ secrets.CHATGPT_PERSO_COOKIES_FIFA || secrets.CHATGPT_PERSO_COOKIES_FIF || secrets.CHATGPT_COOKIES_PERSO_FIFA || secrets.CHATGPT_COOKIES_PERSO_FIF }}
          CHATGPT_COOKIES_FIF: ${{ secrets.CHATGPT_COOKIES_FIF || secrets.CHATGPT_COOKIES_FIFA || secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_PERSO_COOKIES_FIF }}
          CHATGPT_COOKIES_FIFA: ${{ secrets.CHATGPT_COOKIES_FIFA || secrets.CHATGPT_COOKIES_FIF }}
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_PRO_COOKIES_FIF || secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PERSO_COOKIES_FIF || secrets.CHATGPT_COOKIES_FIF || secrets.CHATGPT_COOKIES }}
          
          # URLs de conversation Plan PRO / WORK
          CHATGPT_PRO_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIFA || secrets.CHATGPT_URL_PRO_FIF || secrets.CHATGPT_URL_PRO_FIFA || secrets.CHATGPT_CONVERSATION_URL_PRO_FIF || secrets.CHATGPT_CONVERSATION_URL_PRO_FIFA || secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_WORK_CONVERSATION_URL_FIFA || secrets.URL_PRO_FIF || secrets.URL_PRO_FIFA }}
          CHATGPT_WORK_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_WORK_CONVERSATION_URL_FIFA || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIFA }}
          CHATGPT_PRO_CONVERSATION_URL_FIFA: ${{ secrets.CHATGPT_PRO_CONVERSATION_URL_FIFA || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_URL_PRO_FIFA || secrets.CHATGPT_URL_PRO_FIF }}
          CHATGPT_WORK_CONVERSATION_URL_FIFA: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIFA || secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_PRO_CONVERSATION_URL_FIFA || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF }}
          
          # URLs de conversation Plan PERSO / SECOURS
          CHATGPT_PERSO_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF || secrets.CHATGPT_PERSO_CONVERSATION_URL_FIFA || secrets.CHATGPT_URL_PERSO_FIF || secrets.CHATGPT_URL_PERSO_FIFA || secrets.CHATGPT_CONVERSATION_URL_PERSO_FIF || secrets.CHATGPT_CONVERSATION_URL_PERSO_FIFA || secrets.URL_PERSO_FIF || secrets.URL_PERSO_FIFA }}
          CHATGPT_PERSO_CONVERSATION_URL_FIFA: ${{ secrets.CHATGPT_PERSO_CONVERSATION_URL_FIFA || secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF || secrets.CHATGPT_URL_PERSO_FIFA || secrets.CHATGPT_URL_PERSO_FIF }}
          CHATGPT_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_CONVERSATION_URL_FIF || secrets.CHATGPT_CONVERSATION_URL_FIFA || secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF }}
          CHATGPT_CONVERSATION_URL: ${{ secrets.CHATGPT_PRO_CONVERSATION_URL_FIF || secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF || secrets.CHATGPT_CONVERSATION_URL }}
          
          CHATGPT_IMAGE_PROMPT: ${{ secrets.CHATGPT_IMAGE_PROMPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
