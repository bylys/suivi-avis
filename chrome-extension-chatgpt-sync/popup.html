<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      font-size: 13px;
      outline: none;
      margin-bottom: 14px;
    }
    .status-box {
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      word-break: break-all;
      margin-bottom: 12px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-sync {
      width: 100%;
      padding: 10px;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-pro {
      background: #0284c7;
    }
    .btn-pro:hover {
      background: #0369a1;
    }
    .btn-perso {
      background: #16a34a;
    }
    .btn-perso:hover {
      background: #15803d;
    }
  </style>
</head>
<body>
  <h2>📍 Sync Cookies ChatGPT</h2>
  
  <label for="op-select">Opérateur :</label>
  <select id="op-select">
    <option value="KEVIN">Kevin</option>
    <option value="FIF">Fif / Fifaliana</option>
    <option value="AINA">Aina</option>
    <option value="ANJARA">Anjara</option>
    <option value="KORAIL">Korail</option>
    <option value="KINTANA">Kintana</option>
  </select>

  <div class="status-box" id="status-text">⏳ Chargement...</div>

  <div class="btn-group">
    <button class="btn-sync btn-pro" id="btn-sync-pro">💼 Enregistrer comme Compte PRO</button>
    <button class="btn-sync btn-perso" id="btn-sync-perso">🏠 Enregistrer comme Compte PERSO</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
