name: GMB Image Generator Agent (Séquentiel)

on:
  schedule:
    # Exécution automatique chaque jour à 01h00 du matin heure de Thaïlande (UTC+7 -> 18h00 UTC la veille)
    - cron: '0 18 * * *'
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/gmb-image-agent.yml'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

jobs:
  generate-images:
    name: Agent Image - ${{ matrix.operator }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        operator: [Kevin, Fif]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies & Chromium
        working-directory: ./agent
        run: |
          npm install
          npx playwright install --with-deps chromium
        
      - name: Run Image Generator Agent for ${{ matrix.operator }}
        working-directory: ./agent
        env:
          OPERATOR_NAME: ${{ matrix.operator }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_WORK_COOKIES_KEVIN || secrets.CHATGPT_COOKIES || secrets.CHATGPT_PERSO_COOKIES_KEVIN }}
          CHATGPT_COOKIES_KEVIN: ${{ secrets.CHATGPT_WORK_COOKIES_KEVIN || secrets.CHATGPT_PERSO_COOKIES_KEVIN || secrets.CHATGPT_COOKIES_KEVIN }}
          CHATGPT_COOKIES_FIF: ${{ secrets.CHATGPT_WORK_COOKIES_FIF || secrets.CHATGPT_PERSO_COOKIES_FIF || secrets.CHATGPT_COOKIES_FIF }}
          CHATGPT_WORK_COOKIES_KEVIN: ${{ secrets.CHATGPT_WORK_COOKIES_KEVIN }}
          CHATGPT_WORK_COOKIES_FIF: ${{ secrets.CHATGPT_WORK_COOKIES_FIF }}
          CHATGPT_PERSO_COOKIES_KEVIN: ${{ secrets.CHATGPT_PERSO_COOKIES_KEVIN }}
          CHATGPT_PERSO_COOKIES_FIF: ${{ secrets.CHATGPT_PERSO_COOKIES_FIF }}
          CHATGPT_CONVERSATION_URL: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_KEVIN || secrets.CHATGPT_CONVERSATION_URL }}
          CHATGPT_CONVERSATION_URL_KEVIN: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_KEVIN || secrets.CHATGPT_CONVERSATION_URL_KEVIN }}
          CHATGPT_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF || secrets.CHATGPT_CONVERSATION_URL_FIF }}
          CHATGPT_WORK_CONVERSATION_URL_KEVIN: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_KEVIN }}
          CHATGPT_WORK_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_FIF }}
          CHATGPT_PERSO_CONVERSATION_URL_KEVIN: ${{ secrets.CHATGPT_PERSO_CONVERSATION_URL_KEVIN }}
          CHATGPT_PERSO_CONVERSATION_URL_FIF: ${{ secrets.CHATGPT_PERSO_CONVERSATION_URL_FIF }}
          CHATGPT_IMAGE_PROMPT: ${{ secrets.CHATGPT_IMAGE_PROMPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
