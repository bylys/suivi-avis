<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Suivi Avis GMB</title>
  <script>
    // Single Page App redirect for GitHub Pages and custom domains
    var l = window.location;
    var pathSegmentsToKeep = l.pathname.includes('/suivi-avis') ? 1 : 0;
    var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
    if (!basePath.endsWith('/')) basePath += '/';
    var remainingPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      basePath + '?p=' + remainingPath +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
