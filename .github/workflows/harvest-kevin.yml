name: Moissonneur d'Images - Kevin

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date cible des tâches (YYYY-MM-DD)'
        required: false
        default: '2026-09-09'

jobs:
  harvest-images-kevin:
    name: Moissonneur Photos - Kevin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies & Chromium
        working-directory: ./agent
        run: |
          npm install
          npx playwright install --with-deps chromium
        
      - name: Run Harvester for Kevin
        working-directory: ./agent
        env:
          OPERATOR_NAME: Kevin
          TARGET_DATE: ${{ github.event.inputs.target_date || '2026-09-09' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          
          CHATGPT_PRO_COOKIES_KEVIN: ${{ secrets.CHATGPT_PRO_COOKIES_KEVIN || secrets.CHATGPT_COOKIES_PRO_KEVIN || secrets.CHATGPT_COOKIES_KEVIN_PRO || secrets.COOKIES_PRO_KEVIN || secrets.CHATGPT_WORK_COOKIES_KEVIN }}
          CHATGPT_WORK_COOKIES_KEVIN: ${{ secrets.CHATGPT_WORK_COOKIES_KEVIN || secrets.CHATGPT_PRO_COOKIES_KEVIN || secrets.CHATGPT_COOKIES_PRO_KEVIN }}
          CHATGPT_COOKIES_KEVIN: ${{ secrets.CHATGPT_COOKIES_KEVIN || secrets.CHATGPT_PRO_COOKIES_KEVIN || secrets.CHATGPT_WORK_COOKIES_KEVIN }}
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_PRO_COOKIES_KEVIN || secrets.CHATGPT_WORK_COOKIES_KEVIN || secrets.CHATGPT_COOKIES_KEVIN || secrets.CHATGPT_COOKIES }}
          
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node harvest_conversations.js
