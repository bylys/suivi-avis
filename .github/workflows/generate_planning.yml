name: Génération planning quotidien GMB

on:
  schedule:
    # Exécution automatique chaque jour à 00h30 heure de Thaïlande (UTC+7 -> 17h30 UTC la veille)
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      quota:
        description: "Quota des opérateurs (Kevin/Fif à 65-70, défaut 68)"
        required: false
        default: "68"

jobs:
  planning:
    name: Générer le planning du jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le planning
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DECODO_USER: ${{ secrets.DECODO_USER }}
          DECODO_PASS: ${{ secrets.DECODO_PASS }}
          DECODO_USER_MOBILE: ${{ secrets.DECODO_USER_MOBILE }}
          DECODO_PASS_MOBILE: ${{ secrets.DECODO_PASS_MOBILE }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          QUOTA_PAR_OPERATEUR: ${{ github.event.inputs.quota || '68' }}
        run: python scripts/generate_planning.py
