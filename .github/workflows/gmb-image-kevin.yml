name: GMB Image Generator - Kevin

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date cible (YYYY-MM-DD, optionnel - date du jour par défaut)'
        required: false
        default: ''

concurrency:
  group: browserless-chatgpt-runner
  cancel-in-progress: false

jobs:
  generate-images-kevin:
    name: Agent Image - Kevin
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies & Chromium
        working-directory: ./agent
        run: |
          npm install
          npx playwright install --with-deps chromium
        
      - name: Run Image Generator Agent for Kevin
        working-directory: ./agent
        env:
          OPERATOR_NAME: Kevin
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          FORCE_EXECUTION: 'true'
          FORCE_PLAN_PERSO: 'false'
          FORCE_PLAN_PRO: 'false'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          
          # Cookies Plan PRO / WORK (Globaux ou spécifiques)
          CHATGPT_PRO_COOKIES: ${{ secrets.CHATGPT_PRO_COOKIES || secrets.CHATGPT_WORK_COOKIES }}
          CHATGPT_WORK_COOKIES: ${{ secrets.CHATGPT_WORK_COOKIES || secrets.CHATGPT_PRO_COOKIES }}
          CHATGPT_PRO_COOKIES_KEVIN: ${{ secrets.CHATGPT_PRO_COOKIES_KEVIN || secrets.CHATGPT_COOKIES_PRO_KEVIN || secrets.CHATGPT_COOKIES_KEVIN_PRO || secrets.COOKIES_PRO_KEVIN || secrets.CHATGPT_WORK_COOKIES_KEVIN || secrets.CHATGPT_PRO_COOKIES }}
          CHATGPT_WORK_COOKIES_KEVIN: ${{ secrets.CHATGPT_WORK_COOKIES_KEVIN || secrets.CHATGPT_PRO_COOKIES_KEVIN || secrets.CHATGPT_COOKIES_PRO_KEVIN || secrets.CHATGPT_PRO_COOKIES }}
          
          # Cookies Plan PERSO / SECOURS (Globaux ou spécifiques)
          CHATGPT_PERSO_COOKIES: ${{ secrets.CHATGPT_PERSO_COOKIES || secrets.CHATGPT_COOKIES }}
          CHATGPT_PERSO_COOKIES_KEVIN: ${{ secrets.CHATGPT_PERSO_COOKIES_KEVIN || secrets.CHATGPT_COOKIES_PERSO_KEVIN || secrets.CHATGPT_COOKIES_KEVIN_PERSO || secrets.COOKIES_PERSO_KEVIN || secrets.CHATGPT_PERSO_COOKIES || secrets.CHATGPT_COOKIES }}
          CHATGPT_COOKIES_KEVIN: ${{ secrets.CHATGPT_COOKIES_KEVIN || secrets.CHATGPT_PRO_COOKIES_KEVIN || secrets.CHATGPT_WORK_COOKIES_KEVIN || secrets.CHATGPT_PERSO_COOKIES_KEVIN || secrets.CHATGPT_PERSO_COOKIES || secrets.CHATGPT_COOKIES }}
          CHATGPT_COOKIES: ${{ secrets.CHATGPT_PRO_COOKIES_KEVIN || secrets.CHATGPT_WORK_COOKIES_KEVIN || secrets.CHATGPT_PERSO_COOKIES_KEVIN || secrets.CHATGPT_COOKIES_KEVIN || secrets.CHATGPT_PERSO_COOKIES || secrets.CHATGPT_COOKIES }}
          
          # URLs de conversation Plan PRO / WORK (Optionnel, nouvelle conv auto par défaut)
          CHATGPT_PRO_CONVERSATION_URL: ${{ secrets.CHATGPT_PRO_CONVERSATION_URL || secrets.CHATGPT_WORK_CONVERSATION_URL }}
          CHATGPT_PRO_CONVERSATION_URL_KEVIN: ${{ secrets.CHATGPT_PRO_CONVERSATION_URL_KEVIN || secrets.CHATGPT_URL_PRO_KEVIN || secrets.CHATGPT_CONVERSATION_URL_PRO_KEVIN || secrets.CHATGPT_WORK_CONVERSATION_URL_KEVIN || secrets.URL_PRO_KEVIN || secrets.CHATGPT_PRO_CONVERSATION_URL }}
          CHATGPT_WORK_CONVERSATION_URL_KEVIN: ${{ secrets.CHATGPT_WORK_CONVERSATION_URL_KEVIN || secrets.CHATGPT_PRO_CONVERSATION_URL_KEVIN || secrets.CHATGPT_PRO_CONVERSATION_URL }}
          
          # URLs de conversation Plan PERSO / SECOURS (Optionnel)
          CHATGPT_PERSO_CONVERSATION_URL: ${{ secrets.CHATGPT_PERSO_CONVERSATION_URL || secrets.CHATGPT_CONVERSATION_URL }}
          CHATGPT_PERSO_CONVERSATION_URL_KEVIN: ${{ secrets.CHATGPT_PERSO_CONVERSATION_URL_KEVIN || secrets.CHATGPT_URL_PERSO_KEVIN || secrets.CHATGPT_CONVERSATION_URL_PERSO_KEVIN || secrets.URL_PERSO_KEVIN || secrets.CHATGPT_PERSO_CONVERSATION_URL }}
          CHATGPT_CONVERSATION_URL_KEVIN: ${{ secrets.CHATGPT_CONVERSATION_URL_KEVIN || secrets.CHATGPT_PRO_CONVERSATION_URL_KEVIN || secrets.CHATGPT_WORK_CONVERSATION_URL_KEVIN || secrets.CHATGPT_PERSO_CONVERSATION_URL_KEVIN || secrets.CHATGPT_PERSO_CONVERSATION_URL }}
          CHATGPT_CONVERSATION_URL: ${{ secrets.CHATGPT_PRO_CONVERSATION_URL_KEVIN || secrets.CHATGPT_WORK_CONVERSATION_URL_KEVIN || secrets.CHATGPT_PERSO_CONVERSATION_URL_KEVIN || secrets.CHATGPT_CONVERSATION_URL }}
          
          CHATGPT_IMAGE_PROMPT: ${{ secrets.CHATGPT_IMAGE_PROMPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js
      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-kevin
          path: |
            agent/debug-error-*.png
            agent/debug-step-*.png
          retention-days: 3
          if-no-files-found: ignore
